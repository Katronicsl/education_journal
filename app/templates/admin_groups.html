<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Группы (админ)</title>
    <style>
        :root{--blue:#002FA7;--muted:#666;--card:#fff;--bg:#f7fafd}
        *{box-sizing:border-box}
        body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#222}

        .container{max-width:1100px;margin:36px auto;background:transparent;padding:0 18px}

        header{background:linear-gradient(90deg,#002FA7 60%,#3359D1 100%);color:#fff;padding:12px 20px;display:flex;align-items:center;border-bottom-left-radius:34px;border-bottom-right-radius:34px;box-shadow:0 3px 12px #002fa722;position:relative;z-index:2}
        header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:#e5eaf8;opacity:0.18;border-bottom-left-radius:34px;border-bottom-right-radius:34px;pointer-events:none}
        .logo{flex-shrink:0;margin-right:18px}
        .logo-img{width:56px;height:56px;object-fit:cover;border-radius:50%;background:#fff;user-select:none}
        nav{display:flex;gap:8px;flex-shrink:0}
        nav a{color:#fff;text-decoration:none;font-size:18px;padding:6px 10px;border-radius:10px;transition:background 0.22s,color 0.15s;white-space:nowrap}
        nav a:hover,nav a:focus{background:#EEA200;color:#ffffff}
        .header-right{display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:2px;flex-shrink:0}
        .username{font-size:15px;color:#fff;white-space:nowrap}

        .groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
        .group-card{background:#fff;border-radius:12px;padding:18px;border:1px solid #e8f0ff;text-decoration:none;color:inherit;display:block}
        .group-name{font-size:18px;font-weight:700;color:var(--blue)}
        .group-info{color:#666;margin-top:6px}

        @media (max-width:900px){.container{padding:0 12px}}
    </style>
</head>
<body>
<header>
    <img src="{{ url_for('static', filename='logotip.png') }}" alt="НовГУ" class="logo-img"/>
    <nav>
        <a href="{{ url_for('admin.pending_teachers') }}">Подтверждение преподавателей</a>
        <a href="{{ url_for('admin.student_rating_page') }}">Рейтинг</a>
        <a href="{{ url_for('admin.structure_management') }}">Структура</a>
        <a href="{{ url_for('main.profile') }}">Личный кабинет</a>
    </nav>
    <div class="header-right">
        <span class="username">{{ user.last_name }} {{ user.first_name }} {{ user.middle_name or '' }}</span>
        <img src="{{ url_for('static', filename=user.avatar if user.avatar else 'avatar.png') }}" alt="Avatar" class="avatar" style="width: 28px; height: 28px; border-radius: 50%; background: #fff; object-fit: cover;">
    </div>
</header>

<div class="container">
    <h1>Группы</h1>
    <div style="margin-bottom:18px">
        <input id="groupSearch" type="text" placeholder="Поиск групп, курсов или университетов" style="width:100%;max-width:520px;padding:12px;border:1px solid #d1d9e6;border-radius:12px;font-size:15px">
    </div>
    <div class="groups-grid">
        {% for g in groups %}
        <div class="group-card" data-search="{{ (g.name + ' ' + g.course_name + ' ' + g.university_name).lower() }}">
            <div class="group-name">{{ g.name }}</div>
            <div class="group-info">{{ g.course_name }} • {{ g.university_name }}</div>
            <div class="group-info">Студентов: {{ g.students_count }}</div>
            <div style="margin-top:12px;text-align:right">
                <a href="{{ url_for('admin.group_subjects', group_id=g.id) }}" style="text-decoration:none;background:#E7F1FF;color:var(--blue);padding:8px 12px;border-radius:8px;font-weight:700">Просмотр</a>
                <a href="{{ url_for('admin.group_overview', group_id=g.id) }}" style="text-decoration:none;margin-left:8px;background:#fff;border:1px solid #e6eefb;color:var(--blue);padding:8px 12px;border-radius:8px">Обзор</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('groupSearch');
        const groupCards = document.querySelectorAll('.group-card');

        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            groupCards.forEach(card => {
                const text = card.dataset.search || card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        });
    });
</script>
</body>
</html>
