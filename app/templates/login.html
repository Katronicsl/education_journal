<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход | NovCheck</title>
<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f7fa;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-text-repeated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .bg-text-repeated span {
            position: absolute;
            left: 0;
            top: 45%;
            font-size: 55px;
            font-weight: bold;
            color: rgba(0, 47, 167, 0.08);
            letter-spacing: 0.3em;
            white-space: nowrap;
            width: 300vw;
            animation: move-bg 13s linear infinite;
            user-select: none;
            pointer-events: none;
        }

        @keyframes move-bg {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-45vw);
            }

        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            min-width: 310px;
            margin: 52px auto;
            text-align: center;
            z-index: 1;
            position: relative;
        }

        .logo {
            width: 110px;
            display: block;
            margin: 0 auto 22px auto;
            border-radius: 8px;
            user-select: none;
        }

        .form-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-header p {
            color: #555;
            margin-bottom: 18px;
            font-size: 17px;
        }

        .form-divider {
            width: 100%;
            height: 0;
            border-bottom: 1px solid #e1e5e9;
            margin: 0 0 25px 0;
        }

        .form-section {
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e1e5e9;
            text-align: left;
        }

        .form-section:last-of-type {
            border-bottom: none;
            margin-bottom: 8px;
        }

        .form-section-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 19px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #002FA7;
            font-size: 15px;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
            background-color: #fafbfc;
        }

        input:focus {
            outline: none;
            border-color: #002FA7;
            background-color: #fff;
        }

        .button, button[type="submit"] {
            width: 99%;
            min-width: 320px;
            max-width: 440px;
            margin: 0 auto;
            display: block;
            text-align: center;
            padding: 15px 0;
            font-size: 18px;
            background-color: #002FA7;
            color: white;
            font-weight: 600;
            text-decoration: none;
            border: none;
            border-radius: 13px;
            box-shadow: 0 8px 18px rgba(41,121,255,0.5);
            transition: background-color 0.22s, color 0.22s, box-shadow 0.22s, transform 0.16s;
            user-select: none;
            cursor: pointer;
            margin-top: 16px;
        }

        .button:hover, button[type="submit"]:hover {
            background-color: #EEA200;
            color: #ffffff;
            box-shadow: 0 4px 11px rgba(21,101,192,0.7);
            transform: translateY(2px);
        }

        .button:active, button[type="submit"]:active {
            background-color: #c96b00;
            color: #fff;
            box-shadow: 0 2px 5px rgba(7,30,131,0.85);
            transform: translateY(3px);
            filter: brightness(80%);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 15px;
        }

        .login-link a {
            color: #002FA7;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #e53935;
            font-size: 14px;
        }

        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="bg-text-repeated">
    <span>НОВГУ &nbsp; НОВГУ &nbsp; НОВГУ &nbsp; НОВГУ &nbsp; НОВГУ &nbsp; НОВГУ &nbsp; НОВГУ &nbsp; НОВГУ &nbsp; НОВГУ</span>
</div>
<div class="container">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="НовГУ" class="logo">
    <div class="form-header">
        <h2>Вход</h2>
        <p>Введите свою электронную почту и пароль для входа</p>
    </div>
    <div class="form-divider"></div>
    {% if message %}
        <div class="error-message">{{ message }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-section">
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input id="email" name="email" type="email" placeholder="Ваш email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" placeholder="Пароль" required>
            </div>
        </div>
        <button type="submit" class="button">Войти</button>
    </form>
    <div class="login-link">
        Нет аккаунта? Зарегистрируйтесь как
        <a href="{{ url_for('auth.register') }}">студент</a> или
        <a href="{{ url_for('auth.register_teacher') }}">преподаватель</a>
    </div>
</div>
</body>
</html>
