<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предметы группы (админ)</title>
    <style>
        :root {
            --blue: #002FA7;
            --muted: #666;
            --card: #fff;
            --bg: #f7fafd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI',Arial,sans-serif;
            background: var(--bg);
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 36px auto;
            background: transparent;
            padding: 0 18px;
        }

        header {
            background: linear-gradient(90deg,#002FA7 60%,#3359D1 100%);
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border-bottom-left-radius: 34px;
            border-bottom-right-radius: 34px;
            box-shadow: 0 3px 12px #002fa722;
            position: relative;
            z-index: 2;
        }

        header::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: #e5eaf8;
            opacity: 0.18;
            border-bottom-left-radius: 34px;
            border-bottom-right-radius: 34px;
            pointer-events: none;
        }

        .logo {
            flex-shrink: 0;
            margin-right: 18px;
        }

        .logo-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 50%;
            background: #fff;
            user-select: none;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            padding: 6px 10px;
            border-radius: 10px;
            transition: background 0.22s,color 0.15s;
            white-space: nowrap;
        }

        nav a:hover,nav a:focus {
            background: #EEA200;
            color: #ffffff;
        }

        .subjects-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subject-item {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #e8f0ff;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-title {
            font-weight: 700;
            color: var(--blue);
        }

        .subject-meta {
            color: #666;
            font-size: 14px;
        }

        .subject-content {
            flex: 1;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border: none;
            border-radius: 10px;
            background: #d10000;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background .2s;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .button:hover {
            background: #a30000;
        }

        @media (max-width:900px) {
            .container {
                padding: 0 12px;
            }

            .subject-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .button {
                margin-left: 0;
                margin-top: 12px;
            }

        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin_header.css') }}">
</head>
<body>
{% include 'admin_header.html' %}

<div class="container">
    <a href="{{ url_for('admin.groups_list') }}" style="text-decoration:none;color:#002FA7">← Назад к списку групп</a>
    <h1>Группа: {{ group.name }}</h1>
    <div style="margin-bottom:18px">
        <a href="{{ url_for('admin.assign_subject_to_group', group_id=group.id) }}" style="display:inline-block;padding:10px 16px;border-radius:12px;background:#002FA7;color:#fff;text-decoration:none;font-weight:700">Добавить предмет группе</a>
    </div>
    <div class="subjects-list">
        {% for s in subjects %}
        <div class="subject-item">
            <div class="subject-content">
                <div class="subject-title">{{ s.subject_name }}</div>
                <div class="subject-meta">Преподаватель: {{ s.teacher_name }}</div>
            </div>
            <button class="button" onclick="openDeleteSubjectModal({{ s.assignment_id }}, '{{ s.subject_name }}')">Удалить</button>
        </div>
        {% endfor %}
        {% if not subjects %}
        <div class="subject-item">Нет предметов для этой группы.</div>
        {% endif %}
    </div>
</div>

<!-- Модалка удаления предмета -->
<div id="deleteSubjectModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center">
    <div style="background:#fff;border-radius:16px;padding:32px;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,0.15)">
        <h2 style="margin:0 0 16px 0;color:#d10000;font-size:24px">Удалить предмет?</h2>
        <p id="subjectModalText" style="margin:0 0 24px 0;color:#666;line-height:1.6"></p>
        <div style="display:flex;gap:12px;justify-content:flex-end">
            <button onclick="closeDeleteSubjectModal()" style="padding:10px 22px;border:1px solid #d1d9e6;border-radius:12px;background:#f7fbff;color:#002fa7;font-weight:700;cursor:pointer;transition:background .2s">Отмена</button>
            <button onclick="submitDeleteSubject()" style="padding:10px 22px;border:none;border-radius:12px;background:#d10000;color:#fff;font-weight:700;cursor:pointer;transition:background .2s">Удалить</button>
        </div>
    </div>
</div>

<script>
let deleteSubjectId = null;
let groupId = {{ group.id }};

function openDeleteSubjectModal(assignmentId, subjectName) {
    deleteSubjectId = assignmentId;
    document.getElementById('subjectModalText').textContent = 'Вы уверены, что хотите удалить предмет "' + subjectName + '" из группы?';
    document.getElementById('deleteSubjectModal').style.display = 'flex';
}

function closeDeleteSubjectModal() {
    deleteSubjectId = null;
    document.getElementById('deleteSubjectModal').style.display = 'none';
}

function submitDeleteSubject() {
    if (deleteSubjectId) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/admin/group/' + groupId + '/delete_assignment/' + deleteSubjectId;
        document.body.appendChild(form);
        form.submit();
    }
}
</script>
</body>
</html>
