<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предметы группы (админ)</title>
    <style>
        :root{--blue:#002FA7;--muted:#666;--card:#fff;--bg:#f7fafd}
        *{box-sizing:border-box}
        body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#222}

        .container{max-width:1100px;margin:36px auto;background:transparent;padding:0 18px}

        header{background:linear-gradient(90deg,#002FA7 60%,#3359D1 100%);color:#fff;padding:12px 20px;display:flex;align-items:center;border-bottom-left-radius:34px;border-bottom-right-radius:34px;box-shadow:0 3px 12px #002fa722;position:relative;z-index:2}
        header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:#e5eaf8;opacity:0.18;border-bottom-left-radius:34px;border-bottom-right-radius:34px;pointer-events:none}
        .logo{flex-shrink:0;margin-right:18px}
        .logo-img{width:56px;height:56px;object-fit:cover;border-radius:50%;background:#fff;user-select:none}
        nav{display:flex;gap:8px;flex-shrink:0}
        nav a{color:#fff;text-decoration:none;font-size:18px;padding:6px 10px;border-radius:10px;transition:background 0.22s,color 0.15s;white-space:nowrap}
        nav a:hover,nav a:focus{background:#EEA200;color:#ffffff}

        .subjects-list{display:flex;flex-direction:column;gap:12px}
        .subject-item{padding:14px;border-radius:10px;border:1px solid #e8f0ff;background:#fff}
        .subject-title{font-weight:700;color:var(--blue)}
        .subject-meta{color:#666}

        @media (max-width:900px){.container{padding:0 12px}}
    </style>
</head>
<body>
<header>
    <div class="logo"><img src="{{ url_for('static', filename='logotip.png') }}" class="logo-img"/></div>
    <nav>
        <a href="{{ url_for('main.profile') }}">Личный кабинет</a>
        <a href="{{ url_for('admin.pending_teachers') }}">Подтверждение преподавателей</a>
        <a href="{{ url_for('admin.student_rating_page') }}">Успеваемость</a>
    </nav>
    <div style="margin-left:auto"><a href="{{ url_for('auth.logout') }}" style="color:#fff;text-decoration:none">Выйти</a></div>
</header>

<div class="container">
    <a href="{{ url_for('admin.groups_list') }}" style="text-decoration:none;color:#002FA7">← Назад к списку групп</a>
    <h1>Группа: {{ group.name }}</h1>
    <div class="subjects-list">
        {% for s in subjects %}
        <div class="subject-item">
            <div class="subject-title">{{ s.subject_name }}</div>
            <div class="subject-meta">Преподаватель: {{ s.teacher_name }}</div>
            <div style="margin-top:8px"><a href="{{ url_for('admin.group_management', subject_id=s.subject_id, group_id=group.id) }}">Открыть успеваемость</a></div>
        </div>
        {% endfor %}
        {% if not subjects %}
        <div class="subject-item">Нет предметов для этой группы.</div>
        {% endif %}
    </div>
</div>
</body>
</html>
