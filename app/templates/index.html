<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>NovCheck</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #f5f7fa;
        }

        .bg-text {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .bg-text::before {
            content: "НОВГУ НОВГУ   НОВГУ   НОВГУ   НОВГУ   НОВГУ   НОВГУ   НОВГУ   НОВГУ   НОВГУ";
            position: absolute;
            left: 0;
            bottom: 40%;
            font-size: 55px;
            font-weight: bold;
            width: 200vw;
            color: rgba(0, 47, 167, 0.08);
            letter-spacing: 0.3em;
            white-space: nowrap;
            animation: move-bg 12s linear infinite;
        }

        @keyframes move-bg {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50vw);
            }

        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            text-align: center;
            z-index: 1;
            position: relative;
            user-select: none;
        }

        h1 {
            margin-bottom: 20px;
            color: #222;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        a.button {
            width: 96%;
            min-width: 280px;
            max-width: 420px;
            margin: 0 auto;
            display: block;
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            background-color: #002FA7;
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(41, 121, 255, 0.5);
            transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
            user-select: none;
            cursor: pointer;
        }

        a.button:hover {
            background-color: #EEA200;
            box-shadow: 0 4px 10px rgba(21, 101, 192, 0.7);
            transform: translateY(2px);
        }

        a.button:active {
            background-color: #c96b00;
            box-shadow: 0 2px 5px rgba(7, 30, 131, 0.85);
            transform: translateY(3px);
            filter: brightness(80%);
        }
    </style>
</head>
<body>

    <div class="bg-text"></div>

    <div class="container">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="НовГУ" style="width:110px; margin:0 auto 20px; display:block;">
        <h1>Учёт успеваемости в НОВГУ</h1>
        <p>Чтобы продолжить, пожалуйста, зарегистрируйтесь или войдите в систему.</p>

        <div class="buttons">
            <a href="/login" class="button">Войти</a>
            <a href="/register/student" class="button">Регистрация для студентов</a>
            <a href="/register/teacher" class="button">Регистрация для преподавателей</a>
        </div>
    </div>

</body>
</html>
